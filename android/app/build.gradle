plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.replayradio.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.replayradio.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0-mobile'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        getByName("main") {
            // 网页资源：src/main/assets 下已备好干净的 index/mobile/data 模板
            assets.srcDirs("src/main/assets")
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        // 完整后端依赖：歌切识别/分段精修需要 numpy 与 Pillow（Chaquopy 有预编译 wheel）
        pip {
            install "numpy"
            install "Pillow"
        }
    }
    // Python 源码只用 src/main/python（serve.py 及 auto_segments/seg_refine/songcut 完整模块）。
    // 不要 srcDir("../../tools")：那会把整个 tools/tests 纳入静态分析，构建卡死。
}
